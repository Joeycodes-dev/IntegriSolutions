name = "integri-backend"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Create with: wrangler kv namespace create GEOCODE_CACHE
# then replace the id below.
[[kv_namespaces]]
binding = "GEOCODE_CACHE"
id = "f90525fb01e849b7985131ec93a4ffba"

[[durable_objects.bindings]]
name = "SSE_HUB"
class_name = "SseHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SseHub"]

# Rate limiting — https://developers.cloudflare.com/workers/runtime-apis/bindings/rate-limit/
#
# Cloudflare only supports fixed windows of 10s or 60s. The legacy
# express-rate-limit 15-minute windows were originally remapped to a 60s window
# at the same *sustained* rate (400/15min -> 27/60s), which collapsed burst
# tolerance roughly 15x. Combined with client polling that had grown to
# ~35-40 req/min per dashboard tab, that made 429s routine rather than rare.
# The budgets below are sized against measured client demand with headroom:
#   auth    login is anonymous (per IP); tight on purpose   10/60s
#   api     shared budget for all signed-in traffic        120/60s
#   sync    batches + one request per evidence attachment   60/60s
#   verify  anonymous public QR verification (per IP)       20/60s
#   geocode bounded by the 1 req/1.1s Nominatim throttle    20/60s
#   ip      backstop for identity-keyed requests           600/60s
#
# Keys are per signed-in user (JWT sub) with per IP for anonymous traffic — see
# middleware/rateLimiter.ts. IP_RATE_LIMITER is the wide per-IP backstop that
# also applies to identity-keyed requests.
#
# Note: limits are enforced per Cloudflare location (datacentre) and are
# eventually consistent, so they are a permissive ceiling rather than exact
# accounting. namespace_id must be unique across the account.

[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "SYNC_RATE_LIMITER"
namespace_id = "1003"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "VERIFY_RATE_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "GEOCODE_RATE_LIMITER"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "IP_RATE_LIMITER"
namespace_id = "1006"
simple = { limit = 600, period = 60 }

# Non-secret vars. Secrets (SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, FRONTEND_URL)
# should be set with `wrangler secret put <NAME>` or a local `.dev.vars`.
[vars]
# FRONTEND_URL = "https://your-frontend.example.com"
