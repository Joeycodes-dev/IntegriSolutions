name: Backend CI

# Triggers on every branch rather than only main/develop, so feature branches
# get test feedback before merge instead of first seeing failures on main.
on:
  push:
    branches: ['**']
    paths:
      - 'backend/**'
  pull_request:
    branches: ['**']
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting (typecheck)
        run: npm run lint

      - name: Run tests (with coverage ratchet)
        run: npm run test:coverage

      - name: Build
        run: npm run build
